version: '3.8'

services:
  backend:
    image: amandeep954/portfolio-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - portfolio_net

  frontend:
    image: amandeep954/portfolio-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:5000/api}
    container_name: portfolio_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - portfolio_net

networks:
  portfolio_net:
    driver: bridge
